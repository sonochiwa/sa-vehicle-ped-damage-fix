name: Verified release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release Win32
        run: msbuild VehiclePedDamageFix.sln /t:Rebuild /p:Configuration=Release /p:Platform=Win32

      - name: Package release
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Release tag must contain a semantic version."
          }

          $iniHeader = (Get-Content Config\VehiclePedDamageFix.ini -TotalCount 1)
          if ($iniHeader -ne "# Vehicle Ped Damage Fix v$version") {
              throw "Config\VehiclePedDamageFix.ini declares '$iniHeader', not version $version."
          }

          $archiveName = "VehiclePedDamageFix-v$version.zip"
          $archive = Join-Path build $archiveName
          $checksum = "$archive.sha256"
          $stage = Join-Path build "release\VehiclePedDamageFix-v$version"
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item build\VehiclePedDamageFix.asi, build\VehiclePedDamageFix.ini -Destination $stage

          $readme = @(
              "Vehicle Ped Damage Fix v$version"
              "Created by sonochiwa"
              ""
              "Makes a GTA San Andreas ped shootable while it is getting into or out"
              "of a vehicle. It fixes damage to the ped, not to the car. In the stock"
              "game the collision is switched off from the moment the ped reaches the"
              "door until it is seated, and again until it has been put down on the"
              "way out, so bullets pass through somebody standing beside the car."
              ""
              "Installation"
              ""
              "  1. Extract VehiclePedDamageFix.asi and VehiclePedDamageFix.ini into"
              "     the GTA San Andreas directory or into its scripts directory."
              "  2. Start the game."
              ""
              "Requires GTA San Andreas 1.0 US (or a SA-MP installation based on it)"
              "and an ASI loader. Any other executable version is left untouched."
              ""
              "Set log=1 in VehiclePedDamageFix.ini to have the plugin record what it"
              "patched in VehiclePedDamageFix.log."
              ""
              "Source code: https://github.com/sonochiwa/sa-vehicle-ped-damage-fix"
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText(
              (Join-Path $stage README.txt),
              $readme,
              [Text.UTF8Encoding]::new($false)
          )

          Compress-Archive -Path "$stage\*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -LiteralPath $checksum -Encoding ascii

          $changelog = Get-Content CHANGELOG.md -Raw
          # The optional " - <date>" after the heading must stay on the heading
          # line: under (?s) a \s+ there crosses the blank line and swallows the
          # first bullet of the section.
          $pattern = "(?ms)^##[ \t]+v?$([regex]::Escape($version))(?:[ \t]+-[^\r\n]+)?[ \t]*\r?\n(?<body>.*?)(?=^##[ \t]|\z)"
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) {
              throw "CHANGELOG.md has no section for $version."
          }
          $notes = @(
              $match.Groups['body'].Value.Trim()
              ""
              "### Verifying the download"
              ""
              # Single quotes on purpose: Actions substitutes the tag before
              # PowerShell parses this, so a double-quoted string would read
              # the backtick in `v1.2.0` as the `v escape and emit a vertical
              # tab instead of the tag name.
              'The archive was built by GitHub Actions from tag `${{ github.ref_name }}`. Compare it with the published SHA-256 file or verify its signed build provenance:'
              ""
              '```text'
              "gh attestation verify $archiveName -R $env:GITHUB_REPOSITORY"
              '```'
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText(
              (Join-Path build release-notes.md),
              $notes,
              [Text.UTF8Encoding]::new($false)
          )

          "version=$version" >> $env:GITHUB_OUTPUT
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Attest release archive
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "${{ steps.package.outputs.archive }}" `
            "${{ steps.package.outputs.checksum }}" `
            --verify-tag `
            --latest `
            --title "Vehicle Ped Damage Fix v${{ steps.package.outputs.version }}" `
            --notes-file build\release-notes.md
